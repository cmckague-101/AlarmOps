<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f7f4" />
    <script>
      // Mirrors src/theme.ts: a saved Light/Dark choice wins, otherwise follow the device.
      (() => {
        const STORAGE_KEY = 'fireops-theme';
        const colorScheme = matchMedia('(prefers-color-scheme: dark)');
        const storedTheme = () => {
          try {
            const stored = localStorage.getItem(STORAGE_KEY);
            return stored === 'light' || stored === 'dark' ? stored : null;
          } catch (_) {
            return null;
          }
        };
        const applyTheme = () => {
          const theme = storedTheme() || (colorScheme.matches ? 'dark' : 'light');
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          const meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.content = theme === 'dark' ? '#0F1317' : '#f7f7f4';
        };
        applyTheme();
        colorScheme.addEventListener('change', applyTheme);
      })();
    </script>
    <meta name="description" content="AlarmOps software for fire alarm and security companies — monitoring, response, technicians, and field operations." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AlarmOps" />

    <meta property="og:description" content="Monitor. Respond. Stay ahead. Technicians, fleet, dispatch, and field work in one workspace for fire alarm and security companies." />
    <meta property="og:url" content="https://fireco.vercel.app/" />
