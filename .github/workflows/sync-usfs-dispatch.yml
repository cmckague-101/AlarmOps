name: Sync USFS dispatch data

on:
  schedule:
    # Mondays at 09:00 UTC (1-2am Pacific).
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "new-only: new, renamed and failed lists; refresh: also recheck oldest lists and clean up; full: reprocess everything"
        required: false
        type: choice
        options:
          - new-only
          - refresh
          - full
        default: new-only
      limit:
        description: (refresh) Maximum lists to process
        required: false
        type: string
        default: "200"

permissions:
  contents: read

concurrency:
  group: usfs-dispatch-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Hard cap on billed minutes per run; private repos get 2,000 free minutes a month.
    timeout-minutes: ${{ inputs.mode == 'full' && 360 || 90 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: jobs/usfs-dispatch/requirements.txt
      - run: pip install -r jobs/usfs-dispatch/requirements.txt
      - name: Test PDF parser
        run: pytest jobs/usfs-dispatch/tests -q
      - name: Sync VIPR lists
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FS_USER_AGENT: ${{ secrets.FS_USER_AGENT }}
          FS_REQUEST_INTERVAL: "3"
          MODE: ${{ inputs.mode || 'new-only' }}
          LIMIT: ${{ inputs.limit }}
        run: |
          case "$MODE" in
            new-only) args=(--incremental-only) ;;
            refresh) args=(--recheck-days 28 --limit "${LIMIT:-200}" --cleanup --retention-days 30) ;;
            full) args=(--force --fresh-pdfs --cleanup --retention-days 30) ;;
            *) echo "Unknown mode: $MODE" >&2; exit 1 ;;
          esac
          python jobs/usfs-dispatch/sync_supabase.py "${args[@]}"
